services:
  - type: web
    name: for-creators-web-app
    env: docker
    plan: free
    repo: https://github.com/Nikita-929/for-creator-web-app.git
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: yes
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
